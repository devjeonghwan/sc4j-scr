plugins {
    id 'java-library'
    id 'application'
    id 'org.fogofwarlabs.sc4j.scr.java'
}

group = 'org.fogofwarlabs'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

dependencies {
    compileOnly 'org.jetbrains:annotations:23.0.0'
    testCompileOnly 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.fogofwarlabs.screcorder.RecorderCli'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'sc.recorder.mock', providers.gradleProperty('scRecorderMock').getOrElse('')
    systemProperty 'sc.recorder.game', providers.gradleProperty('scRecorderGame').getOrElse('')
    systemProperty 'sc.recorder.replay', providers.gradleProperty('scRecorderReplay').getOrElse('')
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.tags('apiNote:a:API Note:', 'implSpec:a:Implementation Requirements:')
}
